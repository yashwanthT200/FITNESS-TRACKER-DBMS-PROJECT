services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: fittrack-oracle
    ports:
      - "1522:1521"
    environment:
      ORACLE_PWD: GarminDocker123
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/startup:/opt/oracle/scripts/startup
  influxdb:
    image: influxdb:2.7-alpine
    container_name: fittrack-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=fittrack_admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=FitTrackInflux2026!
      - DOCKER_INFLUXDB_INIT_ORG=FitTrackOrg
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=fittrack-super-secret-admin-token-2026
    volumes:
      - influxdb_data:/var/lib/influxdb2

  backend:
    build:
      context: ./backend
    container_name: fittrack-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      ORACLE_USER: GARMIN_USER
      ORACLE_PASSWORD: GarminDocker123
      ORACLE_CONNECT_STRING: oracle:1521/FREEPDB1
      JWT_SECRET: super_secret_fittrack_key
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: fittrack-super-secret-admin-token-2026
      INFLUX_ORG: FitTrackOrg
      INFLUX_BUCKET: telemetry
    depends_on:
      - oracle
      - influxdb

  frontend:
    build:
      context: ./frontend
    container_name: fittrack-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  oracle_data:
  influxdb_data:
  